{% extends 'history/base.html' %}
{% load static %}

{% block title %}{{ state.title }} | TheKingdom{% endblock %}

{% block content %}

<section class="state-detail">
    <div class="container">

        <a href="{% url 'home' %}#states" class="section-kicker">
            <i class="bi bi-arrow-right"></i>
            العودة إلى الدول السعودية
        </a>

        <div class="mt-4">
            <span class="section-kicker">{{ state.period }}</span>

            <h1 class="mt-3">{{ state.title }}</h1>

            <p>{{ state.description }}</p>
        </div>

        <img
            src="{% static state.image %}"
            alt="{{ state.title }}"
            class="state-detail-image"
        >

    </div>
</section>

{% endblock %}
